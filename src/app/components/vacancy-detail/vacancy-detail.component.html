<div *ngIf="vacancy" class="max-w-3xl mx-auto p-6 bg-white rounded-lg shadow">
    <h2 class="text-2xl font-bold text-primary mb-2">{{ vacancy.position }}</h2>
    <p class="text-gray-700 mb-1">Company: {{ vacancy.company.companyName }}</p>
    <p class="text-gray-700 mb-1">Location: {{ vacancy.location }}</p>
    <p class="text-gray-700 mb-1">Salary: {{ vacancy.salary }}</p>
    <p class="text-gray-700 mb-3">Contacts: {{ vacancy.contacts }}</p>
    <p class="text-gray-600 whitespace-pre-line">{{ vacancy.description }}</p>
  </div>
